
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bokunchi</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 25px 18px;
  min-height: 100vh;
  background: #d8d0bd;
  color: #29271f;
  font-family: "Hiragino Maru Gothic ProN",
    "Yu Gothic", sans-serif;
}

.player {
  max-width: 390px;
  margin: auto;
}

.header {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  letter-spacing: 2px;
  border-bottom: 1px solid #77705f;
  padding-bottom: 12px;
}

.cover {
  margin: 30px auto 22px;
  width: 100%;
  aspect-ratio: 1;
  background: #b7a58a;
  border: 8px solid #e9e2d3;
  box-shadow: 3px 4px 0 #827967;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  transform: rotate(-1deg);
}

.cover::before {
  content: "";
  position: absolute;
  inset: 12px;
  border: 1px dashed #71644f;
}

.cover-title {
  font-family: cursive;
  font-size: clamp(38px, 12vw, 55px);
  font-weight: bold;
  transform: rotate(-6deg);
  color: #39382d;
}

.cover-small {
  position: absolute;
  bottom: 27px;
  right: 25px;
  font-size: 10px;
  letter-spacing: 2px;
}

.album-info {
  padding: 8px 3px 20px;
}

.album-title {
  font-family: cursive;
  font-size: 30px;
  font-weight: bold;
  transform: rotate(-2deg);
  margin-bottom: 7px;
}

.artist {
  font-size: 12px;
  color: #6f695c;
}

.player-box {
  background: #bdb6a5;
  border: 2px solid #777262;
  border-radius: 9px;
  padding: 17px;
  box-shadow: inset 0 0 8px #8b8575;
}

.player-label {
  font-size: 10px;
  letter-spacing: 2px;
  margin-bottom: 12px;
}

audio {
  width: 100%;
  height: 38px;
}

.track-heading {
  font-family: cursive;
  font-size: 19px;
  margin: 30px 0 10px;
  transform: rotate(-2deg);
}

.track {
  display: flex;
  gap: 15px;
  align-items: center;
  padding: 14px 5px;
  border-top: 1px dashed #8c8576;
  cursor: pointer;
  font-size: 13px;
}

.track:active {
  background: #c7beaa;
}

.number {
  color: #827967;
  font-size: 11px;
}

.note {
  text-align: center;
  font-family: cursive;
  font-size: 12px;
  margin-top: 35px;
  color: #77705f;
}
</style>
</head>

<body>
<main class="player">

  <div class="header">
    <span>BOKUNCHI RECORDS</span>
    <span>NO.001</span>
  </div>

  <div class="cover">
    <div class="cover-title">Bokunchi</div>
    <div class="cover-small">MUSIC COLLECTION</div>
  </div>

  <section class="album-info">
    <div class="album-title">Bokunchi.</div>
    <div class="artist">my little music archive</div>
  </section>

  <div class="player-box">
    <div class="player-label">NOW PLAYING ...</div>
    <audio id="audio" controls></audio>
  </div>

  <div class="track-heading">Track list ♪</div>
  <div id="tracks"></div>

  <div class="note">
    made with music & memories.
  </div>

</main>

<script>
const SUPABASE_FUNCTION_URL =
  "https://wjygtnpvfplhwewytiuw.supabase.co/functions/v1/play-music";

const PUBLISHABLE_KEY =
  "sb_publishable_myeFMi72DFGcxKyUEeEY1g_Ro2GsPon";

const audio = document.getElementById("audio");
const list = document.getElementById("tracks");

// NFCのURLについている合言葉を取得
const token = new URLSearchParams(window.location.search).get("key");

// Supabaseの関数を呼び出す
async function callFunction(body) {
  const response = await fetch(SUPABASE_FUNCTION_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": PUBLISHABLE_KEY
    },
    body: JSON.stringify({
      ...body,
      token: token
    })
  });

  const result = await response.json();

  if (!response.ok) {
    throw new Error(result.error || "通信に失敗しました");
  }

  return result;
}

// 曲を再生
async function playTrack(path, item) {
  try {
    list.querySelectorAll(".track").forEach(track => {
      track.classList.remove("playing");
    });

    item.classList.add("playing");
    item.querySelector(".track-title").textContent = "読み込み中...";

    const result = await callFunction({
      action: "play",
      path: path
    });

    audio.src = result.url;
    await audio.play();

    item.querySelector(".track-title").textContent =
      path.replace(/\.mp3$/i, "");
  } catch (error) {
    alert("再生できませんでした: " + error.message);
    item.classList.remove("playing");
  }
}

// 曲一覧を読み込む
async function loadTracks() {
  if (!token) {
    list.textContent = "アクセス用URLを確認してください。";
    return;
  }

  list.textContent = "曲を読み込み中...";

  try {
    const result = await callFunction({
      action: "list"
    });

    list.replaceChildren();

    if (!result.tracks || result.tracks.length === 0) {
      list.textContent = "まだ曲が登録されていません。";
      return;
    }

    result.tracks.forEach((song, index) => {
      const item = document.createElement("div");
      item.className = "track";

      const number = document.createElement("span");
      number.className = "number";
      number.textContent = String(index + 1).padStart(2, "0");

      const title = document.createElement("span");
      title.className = "track-title";
      title.textContent = song.title;

      item.appendChild(number);
      item.appendChild(title);

      item.addEventListener("click", () => {
        playTrack(song.path, item);
      });

      list.appendChild(item);
    });

  } catch (error) {
    list.textContent = "曲の読み込みに失敗しました。";
    console.error(error);
  }
}
audio.addEventListener("error", () => {
  console.error("音声の読み込みに失敗しました");
});
loadTracks();
</script>

</body>
</html>
