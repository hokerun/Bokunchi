
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bokunchi</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap');
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 25px 18px;
  min-height: 100vh;
background:
  radial-gradient(
    ellipse at 50% 0%,
    rgba(255, 255, 255, 0.28) 0%,
    rgba(190, 225, 255, 0.12) 30%,
    transparent 65%
  ),
  linear-gradient(
    180deg,
    #9bcdf0 0%,
    #6da9dc 25%,
    #397bb9 50%,
    #194c83 75%,
    #091e42 100%
  );
  color: #f4f5fa;
 font-family: "Hiragino Sans",
  "Yu Gothic", sans-serif;
}
.player {
  max-width: 390px;
  margin: auto;
}

.header {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  letter-spacing: 2px;
  border-bottom: 1px solid #77705f;
  padding-bottom: 12px;
}

.cover {
  margin: 30px auto 22px;
  width: 100%;
  aspect-ratio: 1;
  overflow: hidden;
  position: relative;
  transform: none;
}

.cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;

  -webkit-mask-image: linear-gradient(
    to bottom,
    black 65%,
    rgba(0, 0, 0, 0.9) 75%,
    rgba(0, 0, 0, 0.5) 88%,
    transparent 100%
  );

  mask-image: linear-gradient(
    to bottom,
    black 65%,
    rgba(0, 0, 0, 0.9) 75%,
    rgba(0, 0, 0, 0.5) 88%,
    transparent 100%
  );
}

.album-info {
  padding: 8px 3px 20px;
}

.album-title {
 font-family: "Caveat", cursive;
  font-size: 30px;
  font-weight: bold;
  transform: rotate(-2deg);
  margin-bottom: 7px;
}

.artist {
  font-size: 12px;
  color: #c5d9ef;
}

.player-box {
  background: rgba(8, 28, 62, 0.55);
  border: 1px solid rgba(190, 220, 255, 0.35);
  border-radius: 12px;
  padding: 17px;
  box-shadow: 0 4px 20px rgba(0, 10, 35, 0.2);
  color: #f4f5fa;
}

.player-label {
  font-size: 10px;
  letter-spacing: 2px;
  margin-bottom: 12px;
}

audio {
  width: 100%;
  height: 38px;
}

.track-heading {
  font-family: cursive;
  font-size: 19px;
  margin: 30px 0 10px;
  transform: rotate(-2deg);
  color: #e4efff;
}

.track {
  display: flex;
  gap: 15px;
  align-items: center;
  padding: 14px 5px;
  border-top: 1px solid rgba(190, 220, 255, 0.25);
  cursor: pointer;
  font-size: 13px;
  color: #f4f5fa;
}

.track:active {
  background: rgba(170, 210, 255, 0.15);
}

.number {
  color: #827967;
  font-size: 11px;
}

.note {
  text-align: center;
  font-family: cursive;
  font-size: 12px;
  margin-top: 35px;
  color: #77705f;
}
</style>
</head>

<body>
<main class="player">

  <div class="header">
    <span>BOKUNCHI RECORDS</span>
    <span>NO.001</span>
  </div>

<div class="cover">
  <img src="cover.PNG" alt="Bokunchi">
</div>

  <section class="album-info">
    <div class="album-title">Bokunchi.</div>
    <div class="artist">my little music archive</div>
  </section>

  <div class="player-box">
    <div class="player-label">NOW PLAYING ...</div>
    <audio id="audio" controls></audio>
  </div>

  <div class="track-heading">Track list ♪</div>
  <div id="tracks"></div>

  <div class="note">
    made with music & memories.
  </div>

</main>

<script>
const SUPABASE_FUNCTION_URL =
  "https://wjygtnpvfplhwewytiuw.supabase.co/functions/v1/play-music";

const PUBLISHABLE_KEY =
  "sb_publishable_myeFMi72DFGcxKyUEeEY1g_Ro2GsPon";

const audio = document.getElementById("audio");
const list = document.getElementById("tracks");

// NFCのURLについている合言葉を取得
const token = new URLSearchParams(window.location.search).get("key");

// Supabaseの関数を呼び出す
async function callFunction(body) {
  const response = await fetch(SUPABASE_FUNCTION_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": PUBLISHABLE_KEY
    },
    body: JSON.stringify({
      ...body,
      token: token
    })
  });

  const result = await response.json();

  if (!response.ok) {
    throw new Error(result.error || "通信に失敗しました");
  }

  return result;
}

// 曲を再生
async function playTrack(path, item) {
  try {
    list.querySelectorAll(".track").forEach(track => {
      track.classList.remove("playing");
    });

    item.classList.add("playing");
    item.querySelector(".track-title").textContent = "読み込み中...";

    const result = await callFunction({
      action: "play",
      path: path
    });

    audio.src = result.url;
    await audio.play();

    item.querySelector(".track-title").textContent =
      path.replace(/\.mp3$/i, "");
  } catch (error) {
    alert("再生できませんでした: " + error.message);
    item.classList.remove("playing");
  }
}

// 曲一覧を読み込む
async function loadTracks() {
  if (!token) {
    list.textContent = "アクセス用URLを確認してください。";
    return;
  }

  list.textContent = "曲を読み込み中...";

  try {
    const result = await callFunction({
      action: "list"
    });

    list.replaceChildren();

    if (!result.tracks || result.tracks.length === 0) {
      list.textContent = "まだ曲が登録されていません。";
      return;
    }

    result.tracks.forEach((song, index) => {
      const item = document.createElement("div");
      item.className = "track";

      const number = document.createElement("span");
      number.className = "number";
      number.textContent = String(index + 1).padStart(2, "0");

      const title = document.createElement("span");
      title.className = "track-title";
      title.textContent = song.title;

      item.appendChild(number);
      item.appendChild(title);

      item.addEventListener("click", () => {
        playTrack(song.path, item);
      });

      list.appendChild(item);
    });

  } catch (error) {
    list.textContent = "曲の読み込みに失敗しました。";
    console.error(error);
  }
}
audio.addEventListener("error", () => {
  console.error("音声の読み込みに失敗しました");
});
loadTracks();
</script>

</body>
</html>
